name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

  minimum-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build package
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '10.4.0'
      - name: Install and smoke-test packaged CLI on Node 10.4
        run: |
          mkdir "$RUNNER_TEMP/runtime-test"
          cd "$RUNNER_TEMP/runtime-test"
          npm init -y
          npm install --production "$RUNNER_TEMP"/*.tgz
          ./node_modules/.bin/nabeatsu 3
